name: RSS Daily Report

on:
  schedule:
    # UTC时间0:30 = 北京时间8:30
    - cron: "20 0 * * *"
  workflow_dispatch: # 支持手动触发

jobs:
  generate-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run RSS Daily Report
        env:
          ZHIPUAI_API_KEY: ${{ secrets.ZHIPUAI_API_KEY }}
          GIST_GITHUB_TOKEN: ${{ secrets.GIST_GITHUB_TOKEN }}
          PUSH_CHANNEL: ${{ vars.PUSH_CHANNEL || 'telegram' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          GEWE_TOKEN: ${{ secrets.GEWE_TOKEN }}
          GEWE_APP_ID: ${{ secrets.GEWE_APP_ID }}
          WECHAT_TO_WXID: ${{ secrets.WECHAT_TO_WXID }}
          HOURS_FILTER: ${{ vars.HOURS_FILTER || '24' }}
        run: |
          echo "🚀 开始执行RSS日报推送..."
          python scripts/run_daily.py

      - name: Notify on Failure
        if: failure()
        run: |
          echo "========================================="
          echo "❌ RSS日报推送失败"
          echo "========================================="
          echo ""
          echo "排查步骤："
          echo "1. 检查 GitHub Secrets / Variables 是否正确配置："
          echo "   - ZHIPUAI_API_KEY（智谱AI API密钥）"
          echo "   - GIST_GITHUB_TOKEN（GitHub Gist 发布令牌）"
          echo "   - PUSH_CHANNEL（仓库 Variables，值为 telegram / discord / wechat）"
          echo "   - TELEGRAM_BOT_TOKEN"
          echo "   - TELEGRAM_CHAT_ID"
          echo "   - DISCORD_WEBHOOK_URL"
          echo "   - DISCORD_BOT_TOKEN"
          echo "   - DISCORD_CHANNEL_ID"
          echo ""
          echo "2. 查看上方日志了解具体错误"
          echo ""
          echo "3. 本地测试："
          echo "   export ZHIPUAI_API_KEY='your_api_key'"
          echo "   export GIST_GITHUB_TOKEN='your_github_gist_token'"
          echo "   export PUSH_CHANNEL='wechat'"
          echo "   export TELEGRAM_BOT_TOKEN='your_token'"
          echo "   export TELEGRAM_CHAT_ID='your_chat_id'"
          echo "   export DISCORD_WEBHOOK_URL='your_webhook_url'"
          echo "   python scripts/run_daily.py"
