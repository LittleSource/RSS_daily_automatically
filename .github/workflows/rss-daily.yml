name: RSS Daily Report

on:
  schedule:
    # UTC时间1:00 = 北京时间9:00
    - cron: '0 1 * * *'
  workflow_dispatch:  # 支持手动触发

jobs:
  generate-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install zhipuai
      
      - name: Run RSS Daily Report
        env:
          ZHIPUAI_API_KEY: ${{ secrets.ZHIPUAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HOURS_FILTER: ${{ vars.HOURS_FILTER || '24' }}
        run: |
          echo "🚀 开始执行RSS日报推送..."
          python scripts/run_daily.py
      
      - name: Notify on Failure
        if: failure()
        run: |
          echo "========================================="
          echo "❌ RSS日报推送失败"
          echo "========================================="
          echo ""
          echo "排查步骤："
          echo "1. 检查GitHub Secrets是否正确配置："
          echo "   - ZHIPUAI_API_KEY（智谱AI API密钥）"
          echo "   - TELEGRAM_BOT_TOKEN"
          echo "   - TELEGRAM_CHAT_ID"
          echo ""
          echo "2. 查看上方日志了解具体错误"
          echo ""
          echo "3. 本地测试："
          echo "   export ZHIPUAI_API_KEY='your_api_key'"
          echo "   export TELEGRAM_BOT_TOKEN='your_token'"
          echo "   export TELEGRAM_CHAT_ID='your_chat_id'"
          echo "   python scripts/run_daily.py"
